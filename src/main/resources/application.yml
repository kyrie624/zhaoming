server:
  port: 8090

# 前端来源多个地址时用英文逗号分隔，例如 http://localhost:8889,http://192.168.1.20:8080
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8889,http://127.0.0.1:8889}

# 外部电表接口。地址留空时定时任务不会发起请求，接入真实接口时只需配置该项。
meter:
  external:
    # 业务接口地址，不在 URL 中固定 deviceId
    url: ${METER_EXTERNAL_URL:}
    # 外部接口要求每个 deviceId 单独请求，多个编号用英文逗号分隔
    device-ids: ${METER_EXTERNAL_DEVICE_IDS:}
    connect-timeout-ms: ${METER_EXTERNAL_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${METER_EXTERNAL_READ_TIMEOUT_MS:10000}
  collection:
    fixed-rate-ms: ${METER_COLLECTION_FIXED_RATE_MS:60000}
    initial-delay-ms: ${METER_COLLECTION_INITIAL_DELAY_MS:0}

spring:
  application:
    name: zhaoming
  profiles:
    active: prod

# MyBatis-Plus 通用配置（与运行环境无关）
mybatis-plus:
  # Mapper XML 位置，默认 classpath:mapper/**/*.xml
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射到 Java 驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键自增（MySQL）
      id-type: auto

# 数据库、redis 等环境相关配置见 application-{profile}.yml
